remote:
  hostname: jellyfin.example.com
  username: jelly
  port: 22
  root: /mnt/data/videos
  directories:
    tv_shows: tv_shows
    movies: movies
    documentaries: documentaries

local:
  root: ~/Videos
  directories:
    tv_shows: "TV Shows"
    movies: Movies
    documentaries: ~/Documentaries

# Required for download.mode: jellyfin (the default) and for unwatched: true.
# Use a secret file for passwords or API keys.
jellyfin:
  base_url: https://jellyfin.example.com
  username: jelly
  api_key_file: /run/secrets/jellyfin/api-key

# Optional: Library settings
library:
  # Season directory pattern
  # Available variables: $name (show name), $season_number
  # Default: "Season $season_number"
  season_pattern: "Season $season_number"
  # Examples:
  # season_pattern: "$name - Season $season_number"  # "Pioneer One - Season 1"
  # season_pattern: "S$season_number"                # "S1"

  # Episode file pattern
  # Available variables: $episode_number
  # Default: "E$episode_number"
  episode_pattern: "E$episode_number"
  # Examples:
  # episode_pattern: "E$episode_number"              # "E01", "E02"
  # episode_pattern: "Episode $episode_number"       # "Episode 01"
  # episode_pattern: "S[0-9]+E$episode_number"       # Matches "S01E01" pattern

# Optional: Custom rsync flags
# If not specified, defaults to: -a -v -z
rsync:
  flags:
    - -a
    - -v
    - -z
    # - --progress
    # - --bwlimit=10000

# Optional: choose where file data is downloaded from (default: jellyfin)
download:
  mode: jellyfin # jellyfin (HTTP, default) or rsync (SSH)

# Optional: number of concurrent jobs (default: 2)
parallelism: 2

# Command used by the TUI's `p` action for selected downloads.
player: mpv

# Optional: command used by the TUI's `o` action to open download directories
# (default: xdg-open, falling back to `gio open`).
# file_manager: nautilus

jobs:
  # Example titles: Pioneer One (CC BY-NC-SA), the Blender open movies
  # (CC BY) and Night of the Living Dead (public domain); the others are
  # made-up names for the filter examples.

  # Sync all of Pioneer One (explicit paths)
  - name: Pioneer One
    remote_dir: $tv_shows/Pioneer One
    local_dir: $tv_shows/Pioneer One

  # Sync a movie using shorthand syntax
  - name: Night of the Living Dead
    directory: movies

  # Sync season 1 into a custom folder
  - name: The Long-Running Show
    remote_dir: "$tv_shows/$name/Season 1"
    local_dir: "$tv_shows/The Long-Running Show - Season 1"

  - name: Example Anthology
    directory: tv_shows
    seasons: "1-10" # seasons 1 to 10 (string with range)

  - name: The Weekly Show
    directory: tv_shows
    seasons: latest-2
    unwatched: true # only episodes marked unplayed by Jellyfin

  - name: Example Comedy
    directory: tv_shows
    seasons: latest

  - name: Example Soap
    directory: tv_shows
    seasons: "13-9999" # season 13 and later

  - name: Example Drama
    directory: tv_shows
    seasons: [1, 2, 5] # specific seasons (list)

  - name: Example Sitcom
    directory: tv_shows
    seasons: "latest-3" # latest 3 seasons

  # Episode filtering examples
  - name: Example Cartoon
    directory: tv_shows
    seasons: "1"
    episodes: "1-5" # episodes 1 to 5 of season 1

  - name: Example Quiz Show
    directory: tv_shows
    seasons: [1, 2]
    episodes: "latest" # only the latest episode from seasons 1 and 2

  - name: Example Talk Show
    directory: tv_shows
    seasons: "latest-2"
    episodes: "latest-5" # latest 5 episodes from the latest 2 seasons

  - name: Example Documentary Series
    directory: tv_shows
    seasons: "latest"
    episodes: [1, 2, 10] # specific episodes from the latest season

  # A Blender open movie; disabled jobs are skipped by `jellysync download`
  - name: Sintel
    directory: movies
    enabled: false

  # Sync using wildcards (resolves to first match)
  - name: "Pioneer One (2010)"
    remote_dir: "$tv_shows/Pioneer One*"
    local_dir: "$tv_shows/Pioneer One (2010)"

  # Sync with wildcard flag (adds *name* pattern)
  - name: Big Buck Bunny
    directory: movies
    wildcard: true # will match *Big Buck Bunny* pattern
