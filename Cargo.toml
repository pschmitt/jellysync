[package]
name = "jellysync"
version = "1.1.0"
edition = "2024"
license = "GPL-3.0-only"
description = "Sync Jellyfin media from rsync/SSH or Jellyfin HTTP"

[[bin]]
name = "jellysync"
path = "src/main.rs"

[dependencies]
anyhow = "1"
clap = { version = "4", features = ["derive"] }
crossterm = "0.28"
dirs = "6"
futures-util = "0.3"
image = { version = "0.25", default-features = false, features = ["jpeg", "png", "webp"] }
ratatui = "0.29"
ratatui-image = { version = "8.0.1", default-features = false, features = ["crossterm"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls", "stream"] }
rusqlite = { version = "0.32", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml = "0.9"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "process", "sync", "fs", "io-util"] }
